{% extends "base.html" %}
{% block title %}Audit log · Kazeyami{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Audit log</h1>
    <p class="muted">Recent system activity</p>
  </div>
</div>
<div class="card">
  <table class="table">
    <thead>
      <tr><th>When</th><th>Action</th><th>Detail</th></tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td class="mono">{{ log.created_at }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.detail or '—' }}</td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="muted">No entries yet</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
